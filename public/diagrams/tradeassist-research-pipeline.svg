<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">TradeAssist — Quant Research Pipeline</title><desc id="desc">A historical market-data pipeline organizes price history into Parquet datasets. Indicator and strategy logic generates entry and exit signals; an event-driven backtest simulates positions with costs, slippage, stops and portfolio constraints. Metrics and walk-forward evaluation generate a research report. No live broker-order execution is shown.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#343fae"/></marker><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#e8e5f1" stroke-width="1"/></pattern><style>
.bg{fill:#fbfaff}.grid{fill:url(#grid)}.frame{fill:none;stroke:#211b43;stroke-width:4}.titlebar{fill:#343fae}.title{font:700 24px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#514b6d}.lane{font:700 14px Arial,sans-serif;fill:#625b7b;letter-spacing:2px}.box{stroke:#211b43;stroke-width:3}.t{font:700 18px Arial,sans-serif;fill:#211b43;text-anchor:middle}.s{font:15px Arial,sans-serif;fill:#514b6d;text-anchor:middle}.tag{font:700 12px Arial,sans-serif;fill:#343fae;letter-spacing:1px}.arrow{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow)}.both{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow);marker-start:url(#arrow)}.dash{fill:none;stroke:#b18c08;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}.small{font:14px Arial,sans-serif;fill:#625b7b}.note{font:700 15px Arial,sans-serif;fill:#8b3e22}.pill{fill:#fff7dc;stroke:#b18c08;stroke-width:2}.warn{fill:#ffe3dc;stroke:#a54837;stroke-width:2}.success{fill:#dff7ec;stroke:#17664a;stroke-width:2}.key{fill:#fff0bf;stroke:#211b43;stroke-width:2}
</style></defs>
<rect class="bg" width="1400" height="900"/><rect class="grid" width="1400" height="900"/><rect class="frame" x="12" y="12" width="1376" height="876"/><rect class="titlebar" x="14" y="14" width="1372" height="58"/><text class="title" x="38" y="51">TRADEASSIST — QUANT RESEARCH PIPELINE</text><text class="sub" x="38" y="101">High-level reconstruction from portfolio documentation and recorded backtest notes · historical research only</text><text class="lane" x="40" y="127">DATA AND STRATEGY CONFIGURATION</text><g><rect class="box" x="40" y="147" width="270" height="128" rx="5" fill="#fff0bf"/><text class="tag" x="54" y="167" style="fill:#6e5200">MARKET DATA</text><text class="t" x="175.0" y="199"><tspan x="175.0">Historical price source</tspan></text><text class="s" x="175.0" y="227"><tspan x="175.0">Angel One SmartAPI / imported bars</tspan><tspan x="175.0" dy="19">Symbol and date range</tspan></text></g><g><rect class="box" x="350" y="147" width="270" height="128" rx="5" fill="#e5e2ff"/><text class="tag" x="364" y="167" style="fill:#343fae">INGESTION</text><text class="t" x="485.0" y="199"><tspan x="485.0">Data preparation</tspan></text><text class="s" x="485.0" y="227"><tspan x="485.0">Validate and normalize bars</tspan><tspan x="485.0" dy="19">Resolve missing / duplicate records</tspan></text></g><g><rect class="box" x="660" y="147" width="270" height="128" rx="5" fill="#dff7ec"/><text class="tag" x="674" y="167" style="fill:#17664a">HISTORICAL STORE</text><text class="t" x="795.0" y="199"><tspan x="795.0">Parquet datasets</tspan></text><text class="s" x="795.0" y="227"><tspan x="795.0">Reusable OHLCV history</tspan><tspan x="795.0" dy="19">Read by backtest runs</tspan></text></g><g><rect class="box" x="970" y="147" width="390" height="128" rx="5" fill="#f5e3ff"/><text class="tag" x="984" y="167" style="fill:#343fae">STRATEGY CONFIG</text><text class="t" x="1165.0" y="199"><tspan x="1165.0">Reproducible parameters</tspan></text><text class="s" x="1165.0" y="227"><tspan x="1165.0">Symbol · period · indicator rules</tspan><tspan x="1165.0" dy="19">SMA 20/50 · stop / trailing-stop settings</tspan></text></g><path class="arrow" d="M310 211 H341"/><path class="arrow" d="M620 211 H651"/><text class="lane" x="40" y="296">SIMULATION, RISK AND EVALUATION</text><g><rect class="box" x="40" y="357" width="300" height="145" rx="5" fill="#e5e2ff"/><text class="tag" x="54" y="377" style="fill:#343fae">SIGNAL ENGINE</text><text class="t" x="190.0" y="409"><tspan x="190.0">Indicators + entry / exit rules</tspan></text><text class="s" x="190.0" y="437"><tspan x="190.0">Pandas / pandas-ta features</tspan><tspan x="190.0" dy="19">Deterministic strategy conditions</tspan></text></g><g><rect class="box" x="370" y="357" width="300" height="145" rx="5" fill="#fff0bf"/><text class="tag" x="384" y="377" style="fill:#6e5200">BACKTEST ENGINE</text><text class="t" x="520.0" y="409"><tspan x="520.0">Event-driven trade simulation</tspan></text><text class="s" x="520.0" y="437"><tspan x="520.0">Position entry / exit</tspan><tspan x="520.0" dy="19">Brokerage, 5-bps slippage, stops</tspan></text></g><g><rect class="box" x="700" y="357" width="300" height="145" rx="5" fill="#dff7ec"/><text class="tag" x="714" y="377" style="fill:#17664a">PORTFOLIO + RISK</text><text class="t" x="850.0" y="409"><tspan x="850.0">Position and exposure controls</tspan></text><text class="s" x="850.0" y="437"><tspan x="850.0">Position sizing and limits</tspan><tspan x="850.0" dy="19">P&amp;L and equity curve</tspan></text></g><g><rect class="box" x="1030" y="357" width="330" height="145" rx="5" fill="#e5e2ff"/><text class="tag" x="1044" y="377" style="fill:#343fae">RESEARCH REPORT</text><text class="t" x="1195.0" y="409"><tspan x="1195.0">Metrics + validation</tspan></text><text class="s" x="1195.0" y="437"><tspan x="1195.0">Return / CAGR / max drawdown</tspan><tspan x="1195.0" dy="19">Sharpe, win rate, profit factor</tspan></text></g><path class="arrow" d="M340 430 H361"/><path class="arrow" d="M670 430 H691"/><path class="arrow" d="M1000 430 H1021"/><path class="arrow" d="M795 275 V312 H190 V348"/><path class="dash" d="M1165 275 V318 H190"/><rect class="pill" x="40" y="540" width="1320" height="105" rx="5"/><text class="note" x="62" y="570">Evaluation layer</text><text class="small" x="62" y="594">Walk-forward evaluation (13 folds) · buy-and-hold comparison · transaction costs and slippage included in the recorded run.</text><text class="small" x="62" y="619">Selected backtest snapshot: IRFC, SMA 20/50 crossover, 5% stop-loss, Jan 2023–Sep 2026. Metrics are historical simulation results, not live trading performance.</text><rect class="warn" x="40" y="674" width="1320" height="104" rx="5"/><text class="note" x="62" y="704">Important boundary</text><text class="small" x="62" y="729">This diagram describes a research / backtesting pipeline. It does not imply that the system places live broker orders or that the recorded strategy will be profitable in the future.</text><text class="small" x="62" y="753">No TradeAssist source repository is attached to this portfolio snapshot; treat this as a documented high-level architecture until implementation code is linked.</text><text class="small" x="38" y="830">Source basis: portfolio project description, resume and recorded backtest notes; detailed module boundaries are illustrative.</text></svg>