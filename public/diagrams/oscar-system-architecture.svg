<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">OSCAR — AI Desktop Automation Architecture</title><desc id="desc">A Windows-first Flutter desktop interface connects to a Python orchestrator and planner/model gateway. Structured actions are validated and routed to browser, desktop UI, terminal, or shortcut agents. Results and fresh observations update shared task context, persistent memory, traces and token-budget accounting.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#343fae"/></marker><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#e8e5f1" stroke-width="1"/></pattern><style>
.bg{fill:#fbfaff}.grid{fill:url(#grid)}.frame{fill:none;stroke:#211b43;stroke-width:4}.titlebar{fill:#343fae}.title{font:700 24px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#514b6d}.lane{font:700 14px Arial,sans-serif;fill:#625b7b;letter-spacing:2px}.box{stroke:#211b43;stroke-width:3}.t{font:700 18px Arial,sans-serif;fill:#211b43;text-anchor:middle}.s{font:15px Arial,sans-serif;fill:#514b6d;text-anchor:middle}.tag{font:700 12px Arial,sans-serif;fill:#343fae;letter-spacing:1px}.arrow{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow)}.both{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow);marker-start:url(#arrow)}.dash{fill:none;stroke:#b18c08;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}.small{font:14px Arial,sans-serif;fill:#625b7b}.note{font:700 15px Arial,sans-serif;fill:#8b3e22}.pill{fill:#fff7dc;stroke:#b18c08;stroke-width:2}.warn{fill:#ffe3dc;stroke:#a54837;stroke-width:2}.success{fill:#dff7ec;stroke:#17664a;stroke-width:2}.key{fill:#fff0bf;stroke:#211b43;stroke-width:2}
</style></defs>
<rect class="bg" width="1400" height="980"/><rect class="grid" width="1400" height="980"/><rect class="frame" x="12" y="12" width="1376" height="956"/><rect class="titlebar" x="14" y="14" width="1372" height="58"/><text class="title" x="38" y="51">OSCAR — AI DESKTOP AUTOMATION ARCHITECTURE</text><text class="sub" x="38" y="101">Reconstructed from the public README and backend module layout · Windows-first local automation prototype</text><text class="lane" x="40" y="126">REQUEST, PLANNING AND EXECUTION STATE</text><g><rect class="box" x="40" y="145" width="270" height="128" rx="5" fill="#fff0bf"/><text class="tag" x="54" y="165" style="fill:#343fae">INTERFACE</text><text class="t" x="175.0" y="197"><tspan x="175.0">Flutter desktop UI</tspan></text><text class="s" x="175.0" y="225"><tspan x="175.0">Task / voice input</tspan><tspan x="175.0" dy="19">Progress and result display</tspan></text></g><g><rect class="box" x="355" y="145" width="280" height="128" rx="5" fill="#dff7ec"/><text class="tag" x="369" y="165" style="fill:#17664a">ORCHESTRATION</text><text class="t" x="495.0" y="197"><tspan x="495.0">Python orchestrator</tspan></text><text class="s" x="495.0" y="225"><tspan x="495.0">Task context, action loop</tspan><tspan x="495.0" dy="19">Plan, run, update, continue</tspan></text></g><g><rect class="box" x="680" y="145" width="280" height="128" rx="5" fill="#e5e2ff"/><text class="tag" x="694" y="165" style="fill:#343fae">PLANNING</text><text class="t" x="820.0" y="197"><tspan x="820.0">Planner + model gateway</tspan></text><text class="s" x="820.0" y="225"><tspan x="820.0">BrainPlanner / GeminiBrain</tspan><tspan x="820.0" dy="19">Gemini / OmniRoute / FreeLLMAPI</tspan></text></g><g><rect class="box" x="1005" y="145" width="355" height="128" rx="5" fill="#e5e2ff"/><text class="tag" x="1019" y="165" style="fill:#343fae">PERSISTENT EXECUTION STATE</text><text class="t" x="1182.5" y="197"><tspan x="1182.5">Memory + observability</tspan></text><text class="s" x="1182.5" y="225"><tspan x="1182.5">Persistent workflow memory</tspan><tspan x="1182.5" dy="19">Trace, run logs, token budget</tspan></text></g><path class="arrow" d="M310 209 H346"/><path class="both" d="M635 209 H671"/><path class="both" d="M960 209 H996"/><text class="lane" x="40" y="321">ACTION SAFETY AND ROUTING</text><g><rect class="box" x="280" y="350" width="650" height="132" rx="5" fill="#fff0bf"/><text class="tag" x="294" y="370" style="fill:#6e5200">VALIDATE BEFORE EXECUTION</text><text class="t" x="605.0" y="402"><tspan x="605.0">Action validation + ActionRouter</tspan></text><text class="s" x="605.0" y="430"><tspan x="605.0">Normalize and validate action payloads</tspan><tspan x="605.0" dy="19">Choose route, track action fingerprints, bounded retry logic</tspan></text></g><g><rect class="box" x="980" y="350" width="380" height="132" rx="5" fill="#dff7ec"/><text class="tag" x="994" y="370" style="fill:#17664a">OBSERVATION CONTEXT</text><text class="t" x="1170.0" y="402"><tspan x="1170.0">Fresh state and outcome checks</tspan></text><text class="s" x="1170.0" y="430"><tspan x="1170.0">Screenshots · visible controls · browser tabs</tspan><tspan x="1170.0" dy="19">Command result · completion evidence</tspan></text></g><path class="arrow" d="M495 273 V310 H605 V341"/><path class="both" d="M930 415 H971"/><text class="small" x="548" y="302">planned action</text><text class="small" x="950" y="399" text-anchor="middle">dispatch / result</text><text class="lane" x="40" y="548">SPECIALIZED EXECUTION ROUTES</text><g><rect class="box" x="40" y="574" width="300" height="126" rx="5" fill="#dff7ec"/><text class="tag" x="54" y="594" style="fill:#17664a">BROWSER AGENT</text><text class="t" x="190.0" y="626"><tspan x="190.0">BrowserAgent</tspan></text><text class="s" x="190.0" y="654"><tspan x="190.0">Playwright automation</tspan><tspan x="190.0" dy="19">Pages, tabs and browser state</tspan></text></g><g><rect class="box" x="370" y="574" width="300" height="126" rx="5" fill="#e5e2ff"/><text class="tag" x="384" y="594" style="fill:#343fae">DESKTOP UI AGENT</text><text class="t" x="520.0" y="626"><tspan x="520.0">UIAgent + vision fallback</tspan></text><text class="s" x="520.0" y="654"><tspan x="520.0">PyAutoGUI / UI Automation</tspan><tspan x="520.0" dy="19">Screenshot, grid and OCR utilities</tspan></text></g><g><rect class="box" x="700" y="574" width="300" height="126" rx="5" fill="#fff0bf"/><text class="tag" x="714" y="594" style="fill:#6e5200">TERMINAL AGENT</text><text class="t" x="850.0" y="626"><tspan x="850.0">TerminalAgent</tspan></text><text class="s" x="850.0" y="654"><tspan x="850.0">Supported terminal workflows</tspan><tspan x="850.0" dy="19">Command output captured as result</tspan></text></g><g><rect class="box" x="1030" y="574" width="330" height="126" rx="5" fill="#f5e3ff"/><text class="tag" x="1044" y="594" style="fill:#343fae">SHORTCUT HANDLER</text><text class="t" x="1195.0" y="626"><tspan x="1195.0">ShortcutHandler</tspan></text><text class="s" x="1195.0" y="654"><tspan x="1195.0">Keyboard / window shortcuts</tspan><tspan x="1195.0" dy="19">Fast path for supported actions</tspan></text></g><path class="arrow" d="M400 482 V526 H190 V565"/><path class="arrow" d="M500 482 V565"/><path class="arrow" d="M705 482 V526 H850 V565"/><path class="arrow" d="M805 482 V526 H1195 V565"/><path class="dash" d="M190 700 V744 H1170 V709"/><path class="dash" d="M520 700 V734 H1170"/><path class="dash" d="M850 700 V724 H1170"/><rect class="pill" x="40" y="775" width="1320" height="92" rx="5"/><text class="note" x="62" y="803">Closed-loop execution</text><text class="small" x="62" y="827">Agents return results and fresh observations → context / persistent state updates → planner chooses the next step.</text><text class="small" x="62" y="849">Reliability safeguards include payload validation, bounded retries, outcome checks and duplicate-action prevention; live results remain app/state dependent.</text><text class="small" x="38" y="925">Source: github.com/smmsa1912/OSCAR · README and backend architecture (planner, orchestrator, routing, agents and persistent memory).</text></svg>