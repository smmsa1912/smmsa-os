<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">KYC Smart Card — initial RFID architecture</title>
  <desc id="desc">The initial design links an RFID smartcard UID to a user profile and centralized document repository. A reader and ESP32 send the identifier to a server, which returns identity documents to a view-only verification interface after the described authorization flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#343fae"/></marker>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#e8e5f1" stroke-width="1"/></pattern>
    <style>
      .bg{fill:#fbfaff}.grid{fill:url(#grid)}.frame{fill:none;stroke:#211b43;stroke-width:4}.titlebar{fill:#343fae}.title{font:700 23px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#514b6d}.lane{font:700 14px Arial,sans-serif;fill:#625b7b;letter-spacing:2px}.box{stroke:#211b43;stroke-width:3}.t{font:700 19px Arial,sans-serif;fill:#211b43;text-anchor:middle}.s{font:15px Arial,sans-serif;fill:#514b6d;text-anchor:middle}.tag{font:700 12px Arial,sans-serif;fill:#343fae;letter-spacing:1px}.arrow{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#b18c08;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}.small{font:14px Arial,sans-serif;fill:#625b7b}.note{font:700 15px Arial,sans-serif;fill:#8b3e22}.pill{fill:#fff7dc;stroke:#b18c08;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/><rect class="grid" width="1200" height="700"/><rect class="frame" x="12" y="12" width="1176" height="676"/>
  <rect class="titlebar" x="14" y="14" width="1172" height="58"/><text class="title" x="38" y="51">KYC SMART CARD · INITIAL RFID DESIGN</text>
  <text class="sub" x="38" y="100">Architecture redrawn from the December 2024 paper · Card-based identity lookup</text>
  <text class="lane" x="38" y="134">ENROLMENT / DOCUMENT REGISTRATION</text>
  <path class="arrow" d="M220 210 H260"/><path class="arrow" d="M460 210 H500"/><path class="arrow" d="M700 210 H740"/>
  <g><rect class="box" x="38" y="158" width="182" height="104" rx="5" fill="#fff0bf"/><text class="tag" x="52" y="178">01 / USER</text><text class="t" x="129" y="207"><tspan x="129">User /</tspan><tspan x="129" dy="22">institution</tspan></text><text class="s" x="129" y="247">Creates profile</text></g>
  <g><rect class="box" x="260" y="158" width="200" height="104" rx="5" fill="#e5e2ff"/><text class="tag" x="274" y="178">02 / REGISTER</text><text class="t" x="360" y="207"><tspan x="360">Web interface</tspan><tspan x="360" dy="22">upload documents</tspan></text><text class="s" x="360" y="247">Registration portal</text></g>
  <g><rect class="box" x="500" y="158" width="200" height="104" rx="5" fill="#dff7ec"/><text class="tag" x="514" y="178">03 / LINK</text><text class="t" x="600" y="207"><tspan x="600">KYC server</tspan><tspan x="600" dy="22">user profile + UID</tspan></text><text class="s" x="600" y="247">Links card to account</text></g>
  <g><rect class="box" x="740" y="158" width="220" height="104" rx="5" fill="#e5e2ff"/><text class="tag" x="754" y="178">CENTRAL REPOSITORY</text><text class="t" x="850" y="207"><tspan x="850">Document store</tspan><tspan x="850" dy="22">identity records</tspan></text><text class="s" x="850" y="247">Backend-managed files</text></g>
  <g><rect class="box" x="990" y="158" width="172" height="104" rx="5" fill="#dff7ec"/><text class="tag" x="1004" y="178">INDEX</text><text class="t" x="1076" y="207"><tspan x="1076">UID ↔</tspan><tspan x="1076" dy="22">profile</tspan></text><text class="s" x="1076" y="247">Lookup reference</text></g>
  <text class="lane" x="38" y="326">VERIFICATION / DOCUMENT RETRIEVAL</text>
  <path class="arrow" d="M220 405 H260"/><path class="arrow" d="M460 405 H500"/><path class="arrow" d="M700 405 H740"/><path class="arrow" d="M960 405 H990"/>
  <g><rect class="box" x="38" y="354" width="182" height="108" rx="5" fill="#fff0bf"/><text class="tag" x="52" y="374">01 / CREDENTIAL</text><text class="t" x="129" y="405"><tspan x="129">RFID</tspan><tspan x="129" dy="22">smartcard</tspan></text><text class="s" x="129" y="447">Unique card ID</text></g>
  <g><rect class="box" x="260" y="354" width="200" height="108" rx="5" fill="#e5e2ff"/><text class="tag" x="274" y="374">02 / READ</text><text class="t" x="360" y="405"><tspan x="360">RC522 reader</tspan><tspan x="360" dy="22">+ ESP32</tspan></text><text class="s" x="360" y="447">Read and forward UID</text></g>
  <g><rect class="box" x="500" y="354" width="200" height="108" rx="5" fill="#dff7ec"/><text class="tag" x="514" y="374">03 / AUTHORIZE</text><text class="t" x="600" y="405"><tspan x="600">Backend lookup</tspan><tspan x="600" dy="22">validate UID</tspan></text><text class="s" x="600" y="447">Find linked profile</text></g>
  <g><rect class="box" x="740" y="354" width="220" height="108" rx="5" fill="#e5e2ff"/><text class="tag" x="754" y="374">04 / RETRIEVE</text><text class="t" x="850" y="405"><tspan x="850">Document fetch</tspan><tspan x="850" dy="22">from repository</tspan></text><text class="s" x="850" y="447">Authorized records</text></g>
  <g><rect class="box" x="990" y="354" width="172" height="108" rx="5" fill="#dff7ec"/><text class="tag" x="1004" y="374">05 / DISPLAY</text><text class="t" x="1076" y="405"><tspan x="1076">Email link</tspan><tspan x="1076" dy="22">+ view-only docs</tspan></text><text class="s" x="1076" y="447">Authorized viewer</text></g>
  <path class="dash" d="M850 262 V310 H600 V345"/><text class="small" x="720" y="300" text-anchor="middle">Profile and document records are retrieved after UID validation</text>
  <rect class="pill" x="38" y="505" width="1124" height="92" rx="5"/><text class="note" x="60" y="533">Security / scope note</text><text class="small" x="60" y="558">This diagram summarizes the paper's initial RFID repository design. It shows the intended architecture and does not represent</text><text class="small" x="60" y="578">a production identity provider or independently audited security implementation.</text>
  <text class="small" x="38" y="642">Source: IJIRT 170646 · KYC Smart Card · Vol. 11, Issue 7 (December 2024), pp. 26–30</text>
</svg>
