<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
<title id="title">FinVerse — NFC Internal-Wallet Payment Architecture</title><desc id="desc">React merchant and wallet interfaces and a Flutter mobile client use the Django REST API. An ESP32-S3/PN532 terminal polls short-lived POS intents and submits card identifiers. Backend services validate device and intent state, card/account binding, balance and risk score, then post wallet updates atomically in PostgreSQL. A Celery/Redis task later hashes transaction metadata and anchors it in an EVM Solidity contract. Known terminal-authentication and card-key limitations are highlighted.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#343fae"/></marker><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#e8e5f1" stroke-width="1"/></pattern><style>
.bg{fill:#fbfaff}.grid{fill:url(#grid)}.frame{fill:none;stroke:#211b43;stroke-width:4}.titlebar{fill:#343fae}.title{font:700 24px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#514b6d}.lane{font:700 14px Arial,sans-serif;fill:#625b7b;letter-spacing:2px}.box{stroke:#211b43;stroke-width:3}.t{font:700 18px Arial,sans-serif;fill:#211b43;text-anchor:middle}.s{font:15px Arial,sans-serif;fill:#514b6d;text-anchor:middle}.tag{font:700 12px Arial,sans-serif;fill:#343fae;letter-spacing:1px}.arrow{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow)}.both{fill:none;stroke:#343fae;stroke-width:4;marker-end:url(#arrow);marker-start:url(#arrow)}.dash{fill:none;stroke:#b18c08;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}.small{font:14px Arial,sans-serif;fill:#625b7b}.note{font:700 15px Arial,sans-serif;fill:#8b3e22}.pill{fill:#fff7dc;stroke:#b18c08;stroke-width:2}.warn{fill:#ffe3dc;stroke:#a54837;stroke-width:2}.success{fill:#dff7ec;stroke:#17664a;stroke-width:2}.key{fill:#fff0bf;stroke:#211b43;stroke-width:2}
</style></defs>
<rect class="bg" width="1500" height="1050"/><rect class="grid" width="1500" height="1050"/><rect class="frame" x="12" y="12" width="1476" height="1026"/><rect class="titlebar" x="14" y="14" width="1472" height="58"/><text class="title" x="38" y="51">FINVERSE — NFC INTERNAL-WALLET PAYMENT ARCHITECTURE</text><text class="sub" x="38" y="101">Reconstructed from the FinVerse project report and IEEE manuscript · prototype architecture, not a production payment rail</text><text class="lane" x="40" y="127">CLIENTS, POS INTENT AND NFC TERMINAL</text><g><rect class="box" x="40" y="148" width="280" height="125" rx="5" fill="#fff0bf"/><text class="tag" x="54" y="168" style="fill:#6e5200">MERCHANT / WEB</text><text class="t" x="180.0" y="200"><tspan x="180.0">React dashboard</tspan></text><text class="s" x="180.0" y="228"><tspan x="180.0">Create merchant POS intent</tspan><tspan x="180.0" dy="19">Amount + reference + expiry</tspan></text></g><g><rect class="box" x="40" y="294" width="280" height="125" rx="5" fill="#e5e2ff"/><text class="tag" x="54" y="314" style="fill:#343fae">WALLET CLIENT</text><text class="t" x="180.0" y="346"><tspan x="180.0">React web / Flutter app</tspan></text><text class="s" x="180.0" y="374"><tspan x="180.0">User account and wallet screens</tspan><tspan x="180.0" dy="19">Internal transfer flows</tspan></text></g><g><rect class="box" x="390" y="185" width="300" height="160" rx="5" fill="#dff7ec"/><text class="tag" x="404" y="205" style="fill:#17664a">APPLICATION API</text><text class="t" x="540.0" y="237"><tspan x="540.0">Django REST Framework</tspan></text><text class="s" x="540.0" y="265"><tspan x="540.0">Merchant intent endpoints</tspan><tspan x="540.0" dy="19">Wallet / account APIs</tspan><tspan x="540.0" dy="19">POS intent lifetime: 120 seconds</tspan></text></g><g><rect class="box" x="790" y="185" width="310" height="160" rx="5" fill="#fff0bf"/><text class="tag" x="804" y="205" style="fill:#6e5200">PHYSICAL TERMINAL</text><text class="t" x="945.0" y="237"><tspan x="945.0">ESP32-S3 + PN532 + TFT</tspan></text><text class="s" x="945.0" y="265"><tspan x="945.0">Wi-Fi polls active intent</tspan><tspan x="945.0" dy="19">Reads card UID + UUID payload</tspan><tspan x="945.0" dy="19">Submits identifiers and intent ID</tspan></text></g><path class="arrow" d="M320 207 H380"/><path class="arrow" d="M320 355 H350 V300 H380"/><path class="both" d="M690 265 H780"/><text class="small" x="350" y="191" text-anchor="middle">create intent</text><text class="small" x="735" y="247" text-anchor="middle">poll / tap request</text><rect class="warn" x="390" y="365" width="710" height="80" rx="5"/><text class="note" x="410" y="389">Known integration / security gaps</text><text class="small" x="410" y="412">Supplied firmware sends a static API key; backend expects device ID + timestamp + nonce + HMAC signature.</text><text class="small" x="410" y="432">MIFARE Classic default key is used for the card payload; anti-cloning resistance is not established.</text><text class="lane" x="40" y="489">SERVER-SIDE VALIDATION AND SETTLEMENT</text><g><rect class="box" x="40" y="512" width="330" height="152" rx="5" fill="#e5e2ff"/><text class="tag" x="54" y="532" style="fill:#343fae">TRANSACTION SERVICE</text><text class="t" x="205.0" y="564"><tspan x="205.0">Django validation gate</tspan></text><text class="s" x="205.0" y="592"><tspan x="205.0">Intent pending / unexpired</tspan><tspan x="205.0" dy="19">Card UID + account UUID binding</tspan><tspan x="205.0" dy="19">Customer / merchant and balance checks</tspan></text></g><g><rect class="box" x="420" y="512" width="300" height="152" rx="5" fill="#fff0bf"/><text class="tag" x="434" y="532" style="fill:#6e5200">RISK SCREEN</text><text class="t" x="570.0" y="564"><tspan x="570.0">XGBoost scorer</tspan></text><text class="s" x="570.0" y="592"><tspan x="570.0">Amount · transaction velocity</tspan><tspan x="570.0" dy="19">Distance · NFC state · type</tspan><tspan x="570.0" dy="19">Configured threshold: 0.80</tspan></text></g><g><rect class="box" x="770" y="512" width="330" height="152" rx="5" fill="#dff7ec"/><text class="tag" x="784" y="532" style="fill:#17664a">POSTGRESQL</text><text class="t" x="935.0" y="564"><tspan x="935.0">Wallet + transaction records</tspan></text><text class="s" x="935.0" y="592"><tspan x="935.0">Row-locked atomic balance posting</tspan><tspan x="935.0" dy="19">Intent state + transaction status</tspan><tspan x="935.0" dy="19">Generic-transfer idempotency records</tspan></text></g><g><rect class="box" x="1150" y="512" width="310" height="152" rx="5" fill="#e5e2ff"/><text class="tag" x="1164" y="532" style="fill:#343fae">CLIENT RESPONSE</text><text class="t" x="1305.0" y="564"><tspan x="1305.0">API result / transaction history</tspan></text><text class="s" x="1305.0" y="592"><tspan x="1305.0">Approved or declined state</tspan><tspan x="1305.0" dy="19">Wallet history and status</tspan></text></g><path class="arrow" d="M540 345 V355 H1120 V503 H205"/><path class="arrow" d="M370 586 H410"/><path class="both" d="M720 586 H760"/><path class="arrow" d="M1100 586 H1140"/><text class="small" x="390" y="573" text-anchor="middle">risk features</text><text class="small" x="740" y="573" text-anchor="middle">accept / reject</text><text class="lane" x="40" y="708">ASYNC AUDIT ANCHOR · NOT THE SETTLEMENT RAIL</text><g><rect class="box" x="40" y="729" width="330" height="125" rx="5" fill="#e5e2ff"/><text class="tag" x="54" y="749" style="fill:#343fae">BACKGROUND QUEUE</text><text class="t" x="205.0" y="781"><tspan x="205.0">Celery + Redis</tspan></text><text class="s" x="205.0" y="809"><tspan x="205.0">Enqueue after DB commit</tspan><tspan x="205.0" dy="19">Retry / recovery task</tspan></text></g><g><rect class="box" x="420" y="729" width="300" height="125" rx="5" fill="#fff0bf"/><text class="tag" x="434" y="749" style="fill:#6e5200">CANONICALIZE + HASH</text><text class="t" x="570.0" y="781"><tspan x="570.0">Keccak-256 metadata digest</tspan></text><text class="s" x="570.0" y="809"><tspan x="570.0">Transaction metadata only</tspan><tspan x="570.0" dy="19">Hash chosen IDs and fields</tspan></text></g><g><rect class="box" x="770" y="729" width="330" height="125" rx="5" fill="#dff7ec"/><text class="tag" x="784" y="749" style="fill:#17664a">EVM CONTRACT</text><text class="t" x="935.0" y="781"><tspan x="935.0">Solidity audit anchor</tspan></text><text class="s" x="935.0" y="809"><tspan x="935.0">Store hashes / amount fields</tspan><tspan x="935.0" dy="19">Emit audit event; duplicate guard</tspan></text></g><g><rect class="box" x="1150" y="729" width="310" height="125" rx="5" fill="#f5e3ff"/><text class="tag" x="1164" y="749" style="fill:#343fae">EVENTUAL CONSISTENCY</text><text class="t" x="1305.0" y="781"><tspan x="1305.0">Anchor can lag settlement</tspan></text><text class="s" x="1305.0" y="809"><tspan x="1305.0">Wallet transfer remains complete</tspan><tspan x="1305.0" dy="19">if chain retry is still pending</tspan></text></g><path class="dash" d="M935 664 V696 H205 V720"/><path class="arrow" d="M370 792 H410"/><path class="arrow" d="M720 792 H760"/><path class="arrow" d="M1100 792 H1140"/><rect class="pill" x="40" y="883" width="1420" height="92" rx="5"/><text class="note" x="62" y="912">Prototype and evaluation notes</text><text class="small" x="62" y="936">Monetary settlement is in the Django/PostgreSQL application database; the EVM contract stores an asynchronous audit anchor, not funds.</text><text class="small" x="62" y="958">Risk training labels are synthetic rule-derived labels; fraud generalization and end-to-end terminal interoperability remain unvalidated in the manuscript.</text><text class="small" x="38" y="1016">Source basis: FinVerse_IEEE_Paper_University_Project.tex and FinVerse_Major_Project_Report_Updated.pdf (October 2026).</text></svg>